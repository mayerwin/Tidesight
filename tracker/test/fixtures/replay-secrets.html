<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Replay secrets</title>
  <script src="/loader.js"></script>
  <script>
    // In a script, not an onclick attribute: replays leave scripts out but keep attributes.
    function addLink() {
      var a = document.createElement('a');
      a.href = '/invite?ticket=MUTSECRET-000';
      a.textContent = 'Invite';
      document.body.appendChild(a);
      document.getElementById('reset').setAttribute('href', '/account/reset?token=ATTRSECRET-111');
      var pasted = document.createElement('a'); // as if pasted into the editor
      pasted.href = 'https://private.example/PASTED-SECRET';
      pasted.textContent = 'pasted';
      document.getElementById('editor').appendChild(pasted);
    }
  </script>
</head>
<body>
  <h1>Account settings</h1>
  <a id="reset" href="/account/reset?token=DOMSECRET-123&amp;lang=en">Reset your password</a>
  <form id="pay" action="/pay?session_id=SESSIONSECRET-456" onsubmit="event.preventDefault()"><button type="submit">Pay</button></form>
  <img alt="" width="1" height="1" srcset="/pixel.png?sig=SIGSECRET-789 2x, /pixel.png 1x">
  <div id="editor" contenteditable="true">Draft: <a href="https://docs.google.com/document/d/PRIVATE-DOC-ID/edit">doc</a>
    <img alt="screenshot of my bank statement" src="data:image/png;base64,iVBORw0KGgoPRIVATEIMG" width="1" height="1">
    <span data-mention="jane.doe@example.com" title="Jane Doe &lt;jane.doe@example.com&gt;">@Jane</span></div>
  <div class="ts-mask"><a href="/messages?thread=MASKEDLINKSECRET">Masked link</a></div>
  <div style="width: 1px; height: 1px; background-image: url('/bg.png?X-Amz-Signature=STYLESECRET')"></div>
  <img alt="" width="1" height="1" data-src="/lazy.png?token=DATASRCSECRET">
  <iframe width="1" height="1" srcdoc="&lt;a href='https://x.example/?token=SRCDOCSECRET'&gt;x&lt;/a&gt;"></iframe>
  <div id="aria" role="textbox" tabindex="0">Private ARIA draft</div>
  <button id="add-link" onclick="addLink()">Add link</button>
</body>
</html>
