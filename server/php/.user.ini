; Tidesight collector: PHP settings for CGI/FastCGI hosts (PHP-FPM, suPHP, ...).
; Ignored by mod_php and by the built-in server.

; Leave request bodies unparsed: the collector reads php://input itself, and this keeps the
; raw body available for every content type (PHP empties it for multipart/form-data).
enable_post_data_reading = Off

; Never print diagnostics into responses.
display_errors = Off
